[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-radar"
version = "0.1.0"
description = "Tells a Python repo which dependency releases actually break its code."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
